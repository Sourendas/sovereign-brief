name: build-demo-video
on:
  push:
    paths:
      - "demo/build_demo_mp4.sh"
      - ".github/workflows/build-demo-video.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mp4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Render demo mp4 with ffmpeg
        timeout-minutes: 10
        run: |
          set -euo pipefail
          bash demo/build_demo_mp4.sh
          git config user.name "Souren Das"
          git config user.email "sourendas0@gmail.com"
          git add demo/sovereign-brief-demo.mp4
          if git diff --cached --quiet; then
            echo "mp4 unchanged"
            exit 0
          fi
          git commit -m "Add SovereignBrief demo video"
          git push origin HEAD:main
